name: Optimize original MS moon logo
on:
  push:
    branches:
      - chore/ms-journey-hero-optimized-logo-20261116
    paths:
      - 'scripts/optimize-ms-moon.py'
      - '.github/workflows/optimize-ms-moon.yml'
      - 'images/ms-moon-logo.png'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/ms-journey-hero-optimized-logo-20261116
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/optimize-ms-moon.py
      - name: Commit generated optimized image to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/ms-moon-logo-optimized.webp
          if ! git diff --cached --quiet; then
            git commit -m "Generate optimized WebP from original MS moon PNG"
            git push origin HEAD:chore/ms-journey-hero-optimized-logo-20261116
          fi
